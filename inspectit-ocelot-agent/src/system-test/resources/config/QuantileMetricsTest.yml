# overwrite settings from default.yml for system tests
inspectit:
  metrics:
    definitions:
      quantiles_test:
        unit: values
        # instrument-type will be ignored for QUANTILES
        views:
          quantiles_test:
            aggregation: QUANTILES
            time-window: 60s
            attributes:
              foo: true

  instrumentation:
    scopes:
      QuantileMetricsTest-record:
        type:
          name: rocks.inspectit.ocelot.instrumentation.QuantileMetricsTest
        methods:
          - name: record

    rules:
      QuantileMetricsTest-record:
        scopes:
          QuantileMetricsTest-record: true
        metrics:
          quantiles_test:
            value: _arg0
            data-tags:
              foo: _arg1
